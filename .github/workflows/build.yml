name: Build release artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir -p artifacts && npm run pack:sdk
      - run: dotnet publish server/School.Api -c Release -o artifacts/api
      - run: dotnet publish server/School.Bff -c Release -o artifacts/bff
      - uses: actions/upload-artifact@v4
        with:
          name: school-portal-release
          path: artifacts/
          retention-days: 7
